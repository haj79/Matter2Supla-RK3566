name: Cleanup build artifacts and old runs
# Only cleans obsolete artifacts; does not compile Android or Matter.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cleanup-old-artifacts.yml'

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Keep the latest 3 Matter ARM64 libraries artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          NAME="matter-controller-android-arm64-stage2"
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "'"$NAME"'") | {id, created_at, expired}' \
            | jq -sr 'sort_by(.created_at) | reverse | .[3:] | .[].id' \
            | while read -r artifact_id; do
                [ -n "$artifact_id" ] || continue
                echo "Deleting obsolete $NAME artifact ID $artifact_id"
                gh api -X DELETE "repos/$REPO/actions/artifacts/$artifact_id"
              done
          echo "Artifact cleanup completed, newest three $NAME artifacts retained."

      - name: Keep the latest 5 build runs and remove old housekeeping runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${GITHUB_REPOSITORY}"
          BUILD_NAME="Stage 2 - Native Matter controller for Android ARM64"
          # Preserve 5 most recent build runs, regardless of their result.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | {id, name, created_at, status}' \
            | jq -sr --arg name "$BUILD_NAME" 'map(select(.name == $name)) | sort_by(.created_at) | reverse | .[5:] | .[].id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Deleting obsolete build run $run_id"
                gh api -X DELETE "repos/$REPO/actions/runs/$run_id"
              done
          # Also remove earlier cleanup-only runs from the Actions list, excluding this active run.
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name != "Stage 2 - Native Matter controller for Android ARM64") | {id, status}' \
            | jq -sr --argjson current "$GITHUB_RUN_ID" '.[] | select(.id != $current and .status == "completed") | .id' \
            | while read -r run_id; do
                [ -n "$run_id" ] || continue
                echo "Deleting obsolete non-Stage-2 run $run_id"
                gh api -X DELETE "repos/$REPO/actions/runs/$run_id"
              done
