name: Stage 2 - Native Matter controller for Android ARM64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-matter-controller-android.yml'

permissions:
  contents: read

jobs:
  matter-controller-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TERM: xterm
      TARGET_CPU: arm64
    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Install host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-pip \
            cmake ninja-build pkg-config unzip zip curl wget \
            libssl-dev libglib2.0-dev libdbus-1-dev

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

      - name: Export Android paths
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      
      - name: Checkout official Matter SDK
        shell: bash
        run: |
          # Keep this SDK revision identical to the controller already used by SUPLA(t).
          mkdir matter-sdk
          git -C matter-sdk init
          git -C matter-sdk remote add origin https://github.com/project-chip/connectedhomeip.git
          git -C matter-sdk fetch --depth 1 origin a35a5740060f882f1b58a479011fcf650c3e1a19
          git -C matter-sdk checkout --detach FETCH_HEAD
          git -C matter-sdk rev-parse HEAD > matter-sdk-revision.txt

      - name: Checkout Matter SDK submodules
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/checkout_submodules.py --shallow --platform android
          test -f third_party/lwip/repo/src/core/ipv4/icmp.c
          test -f third_party/lwip/repo/src/netif/ethernet.c
          test -f third_party/uriparser/repo/src/UriParse.c



      - name: Use canonical Maven Central endpoint for Matter Java dependencies
        working-directory: matter-sdk
        shell: bash
        run: |
          set -euo pipefail
          # Upstream set_up_java_deps.sh hardcodes repo1.maven.org; it returns 403
          # for some GitHub-hosted runners. Change only the mirror, not versions.
          SCRIPT=third_party/java_deps/set_up_java_deps.sh
          test -f "$SCRIPT"
          grep -q 'repo1.maven.org' "$SCRIPT"
          sed -i 's/repo1.maven.org/repo.maven.apache.org/g' "$SCRIPT"
          # Make transient CDN failures retriable and report the rejected URL.
          sed -i 's/curl --fail --location --silent --show-error/curl --retry 4 --retry-all-errors --retry-delay 3 --fail --location --silent --show-error/g' "$SCRIPT"
          # The final upstream dependency is hosted at dist.wso2.org (403).
          # Fetch the same Google Collections 1.0-rc1 library from Maven Central.
          # This jar is only used for Java test dependencies, not packaged into the APK.
          python3 - <<'PY'
          from pathlib import Path
          script = Path("third_party/java_deps/set_up_java_deps.sh")
          text = script.read_text()
          old = 'download_jar "dist.wso2.org" "com/google/common/google-collect/1.0-rc1/" "google-collect-1.0-rc1.jar"'
          new = '''if [ ! -s third_party/java_deps/artifacts/google-collect-1.0-rc1.jar ]; then
              curl --retry 4 --retry-all-errors --retry-delay 3 --fail --location --show-error \\
                https://repo.maven.apache.org/maven2/com/google/collections/google-collections/1.0-rc1/google-collections-1.0-rc1.jar \\
                -o third_party/java_deps/artifacts/google-collect-1.0-rc1.jar
          fi'''
          if text.count(old) != 1:
              raise SystemExit("Expected WSO2 dependency line not found exactly once")
          script.write_text(text.replace(old, new))
          PY
          echo "Maven dependency sources after patch:"
          grep -E 'download_jar|google-collections-1.0-rc1.jar' "$SCRIPT" | tail -n 16

      - name: Fix CASE JNI callback invocation with typed arguments
        working-directory: matter-sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/controller/java/AndroidCallbacks.cpp")
          source = path.read_text()
          # Keep each Java callback rooted in a local JNI frame for the full call.
          before = """    jobject javaCallback = self->mJavaCallbackRef.ObjectRef();
              JniLocalReferenceScope scope(env);"""
          after = """    JniLocalReferenceScope scope(env);
              jobject javaCallback = env->NewLocalRef(self->mJavaCallbackRef.ObjectRef());
              VerifyOrReturn(javaCallback != nullptr,
                             ChipLogError(Controller, "Unable to pin CASE callback"));"""
          assert source.count(before) == 2, "SDK callback source has changed"
          source = source.replace(before, after)
          # Avoid C-varargs for a native pointer transported as a Java long.
          # The jvalue union explicitly marks the first parameter as primitive J.
          old_success = "    env->CallVoidMethod(javaCallback, successMethod, reinterpret_cast<jlong>(device));"
          new_success = """    jvalue successArgs[1] = {};
              successArgs[0].j = reinterpret_cast<jlong>(device);
              env->CallVoidMethodA(javaCallback, successMethod, successArgs);"""
          assert source.count(old_success) == 1
          source = source.replace(old_success, new_success)
          old_failure = "    env->CallVoidMethod(javaCallback, failureMethod, failureInfo.peerId.GetNodeId(), exception);"
          new_failure = """    jvalue failureArgs[2] = {};
              failureArgs[0].j = static_cast<jlong>(failureInfo.peerId.GetNodeId());
              failureArgs[1].l = exception;
              env->CallVoidMethodA(javaCallback, failureMethod, failureArgs);"""
          assert source.count(old_failure) == 1
          source = source.replace(old_failure, new_failure)
          path.write_text(source)
          print("CASE JNI success/failure callbacks use pinned references and typed jvalue arguments")
          PY

      - name: Trace CASE callback JNI ownership transitions
        working-directory: matter-sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("src/controller/java/AndroidCallbacks.cpp")
          s = p.read_text()
          # Trace raw handles only. Never pass a potentially invalid jobject to
          # GetObjectRefType, NewGlobalRef, or any other validating JNI operation.
          success = "    jvalue successArgs[1] = {};"
          assert s.count(success) == 1
          s = s.replace(success, """    ChipLogError(Controller, "CASE-OWNER success self=%p callback=%p wrapper=%p device=%p method=%p env=%p",
                           static_cast<void *>(self), static_cast<void *>(javaCallback),
                           static_cast<void *>(globalRef.ObjectRef()), static_cast<void *>(device),
                           reinterpret_cast<void *>(successMethod), static_cast<void *>(env));
              jvalue successArgs[1] = {};""")
          failure = "    jvalue failureArgs[2] = {};"
          assert s.count(failure) == 1
          s = s.replace(failure, """    ChipLogError(Controller, "CASE-OWNER failure self=%p callback=%p env=%p",
                           static_cast<void *>(self), static_cast<void *>(javaCallback), static_cast<void *>(env));
              jvalue failureArgs[2] = {};""")
          ctor = "GetConnectedDeviceCallback::~GetConnectedDeviceCallback() {}"
          assert s.count(ctor) == 1
          s = s.replace(ctor, """GetConnectedDeviceCallback::~GetConnectedDeviceCallback()
          {
              ChipLogError(Controller, "CASE-OWNER destroy native=%p", static_cast<void *>(this));
          }""")
          create = "    return reinterpret_cast<jlong>(connectedDeviceCallback);"
          assert s.count(create) == 1
          s = s.replace(create, """    ChipLogError(Controller, "CASE-OWNER create native=%p java=%p wrapper=%p",
                           static_cast<void *>(connectedDeviceCallback), static_cast<void *>(callback),
                           static_cast<void *>(self));
              return reinterpret_cast<jlong>(connectedDeviceCallback);""")
          destroy = "    chip::Platform::Delete(connectedDeviceCallback);"
          assert s.count(destroy) == 1
          s = s.replace(destroy, """    ChipLogError(Controller, "CASE-OWNER delete native=%p", static_cast<void *>(connectedDeviceCallback));
              chip::Platform::Delete(connectedDeviceCallback);""")
          p.write_text(s)
          print("CASE ownership checkpoints installed; no JNI lifecycle or ABI logic altered")
          PY

      - name: Add typed Java callback bridge for Android ART
        working-directory: matter-sdk
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          java = Path("src/controller/java/src/chip/devicecontroller/SuplaCaseCallbackAdapter.java")
          java.write_text("""package chip.devicecontroller;

          /**
           * JNI calls a concrete Java class with an unambiguous primitive long signature.
           * Delegation to the Kotlin dynamic proxy happens only after leaving JNI.
           */
          public final class SuplaCaseCallbackAdapter
              implements GetConnectedDeviceCallbackJni.GetConnectedDeviceCallback {
            private final GetConnectedDeviceCallbackJni.GetConnectedDeviceCallback delegate;

            public SuplaCaseCallbackAdapter(GetConnectedDeviceCallbackJni.GetConnectedDeviceCallback delegate) {
              if (delegate == null) throw new NullPointerException("delegate");
              this.delegate = delegate;
            }

            @Override
            public void onDeviceConnected(long devicePointer) {
              delegate.onDeviceConnected(devicePointer);
            }

            @Override
            public void onConnectionFailure(long nodeId, Exception error) {
              delegate.onConnectionFailure(nodeId, error);
            }
          }
          """)
          build = Path("src/controller/java/BUILD.gn")
          content = build.read_text()
          old = '    "src/chip/devicecontroller/GetConnectedDeviceCallbackJni.java",'
          assert content.count(old) == 1
          content = content.replace(old, old + '\n    "src/chip/devicecontroller/SuplaCaseCallbackAdapter.java",')
          build.write_text(content)
          print("Built concrete primitive-long callback adapter into Matter Java API")
          PY

      - name: Generate Android ARM64 Matter build files
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          source scripts/activate.sh
          TARGET_CPU=arm64 ./scripts/examples/android_app_ide.sh
          # These are real GN targets, not build_examples.py target names.
        

      - name: Build Matter controller JNI and Java libraries
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          source scripts/activate.sh
          ninja -C out/android_arm64 \
            src/controller/java:jni \
            src/controller/java:java \
            src/controller/java:android_chip_im \
            src/controller/java:chipcluster \
            src/controller/java:chipclusterID
          # All Java controller dependencies are required for CASE, ON/OFF and Basic Information.
          # The standalone CHIPController.jar is only the controller shell.

      - name: Collect built Matter controller libraries
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p stage2-output
          cp matter-sdk-revision.txt stage2-output/
          find matter-sdk/out/android_arm64 -type f \
            \( -name 'libCHIPController.so' -o -name 'CHIPController.jar' \) \
            -print -exec cp -v {} stage2-output/ \;
          for jar in CHIPController.jar CHIPInteractionModel.jar CHIPClusters.jar CHIPClusterID.jar; do
            found=$(find matter-sdk/out/android_arm64 -type f -name "$jar" -print -quit)
            test -n "$found"
            cp -v "$found" "stage2-output/$jar"
          done
          test -s stage2-output/libCHIPController.so
          test -s stage2-output/CHIPController.jar
          # Fail early if this build cannot control devices or read their metadata.
          jar tf stage2-output/CHIPInteractionModel.jar > /tmp/matter-java-classes.txt
          grep -Fq 'chip/devicecontroller/GetConnectedDeviceCallbackJni$GetConnectedDeviceCallback.class' /tmp/matter-java-classes.txt
          grep -Fq 'chip/devicecontroller/ReportCallback.class' /tmp/matter-java-classes.txt
          grep -Fq 'chip/devicecontroller/model/NodeState.class' /tmp/matter-java-classes.txt
          grep -Fq 'chip/devicecontroller/ChipClusters$OnOffCluster.class' /tmp/matter-java-classes.txt
          file stage2-output/libCHIPController.so
          ( cd stage2-output && sha256sum libCHIPController.so *.jar > SHA256SUMS.txt )

      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: matter-controller-android-arm64-stage2
          path: stage2-output/
          if-no-files-found: error
          retention-days: 14
