name: Stage 2 - Native Matter controller for Android ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matter-controller-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TERM: xterm
      TARGET_CPU: arm64
    steps:
      - name: Checkout our repository
        uses: actions/checkout@v4

      - name: Install host requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-venv python3-pip \
            cmake ninja-build pkg-config unzip zip curl wget \
            libssl-dev libglib2.0-dev libdbus-1-dev

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK and NDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;28.2.13676358'

      - name: Export Android paths
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/28.2.13676358" >> "$GITHUB_ENV"

      
      - name: Checkout official Matter SDK
        shell: bash
        run: |
          git clone --depth 1 https://github.com/project-chip/connectedhomeip.git matter-sdk
          git -C matter-sdk rev-parse HEAD > matter-sdk-revision.txt

      - name: Checkout Matter SDK submodules
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          python3 scripts/checkout_submodules.py --shallow --platform android
          test -f third_party/lwip/repo/src/core/ipv4/icmp.c
          test -f third_party/lwip/repo/src/netif/ethernet.c
          test -f third_party/uriparser/repo/src/UriParse.c



      - name: Generate Android ARM64 Matter build files
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          source scripts/activate.sh
          TARGET_CPU=arm64 ./scripts/examples/android_app_ide.sh
          # These are real GN targets, not build_examples.py target names.
        

      - name: Build Matter controller JNI and Java libraries
        working-directory: matter-sdk
        shell: bash
        run: |
          set -eo pipefail
          source scripts/activate.sh
          ninja -C out/android_arm64 src/controller/java:jni src/controller/java:java

      - name: Collect built Matter controller libraries
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p stage2-output
          cp matter-sdk-revision.txt stage2-output/
          find matter-sdk/out/android_arm64 -type f \
            \( -name 'libCHIPController.so' -o -name 'CHIPController.jar' \) \
            -print -exec cp -v {} stage2-output/ \;
          test -s stage2-output/libCHIPController.so
          test -s stage2-output/CHIPController.jar
          file stage2-output/libCHIPController.so
          sha256sum stage2-output/libCHIPController.so stage2-output/CHIPController.jar \
            > stage2-output/SHA256SUMS.txt

      - name: Upload ARM64 libraries
        uses: actions/upload-artifact@v4
        with:
          name: matter-controller-android-arm64-stage2
          path: stage2-output/
          if-no-files-found: error
          retention-days: 14
