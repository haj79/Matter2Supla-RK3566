name: Build Android ARM64 bootstrap

on:
  workflow_dispatch:
  push:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - '.github/workflows/build-android-arm64.yml'

permissions:
  contents: read

jobs:
  android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install NDK
        run: sdkmanager --install 'ndk;28.2.13676358'
      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/28.2.13676358/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-33 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --parallel
      - name: Inspect binary
        run: |
          file build/matter-supla
          test -s build/matter-supla
      - name: Upload ARM64 executable
        uses: actions/upload-artifact@v4
        with:
          name: matter-supla-bootstrap-arm64
          path: build/matter-supla
          if-no-files-found: error
